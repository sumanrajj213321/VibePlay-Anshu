name: Build VibePlay APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vibeplay-main-pipeline
  cancel-in-progress: false

jobs:
  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase test dependencies
        run: |
          npm init -y
          npm install --no-audit --no-fund firebase-tools @firebase/rules-unit-testing firebase

      - name: Run Firestore rules unit tests
        run: npx firebase emulators:exec --only firestore --project demo-no-project --config firebase.json "node --test firestore.test.js"

  functions-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Validate Cloud Functions JavaScript syntax
        run: node --check functions/index.js

  build-debug-apk:
    needs: [firestore-rules-tests, functions-validation]
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    MUSIC_API_BASE_URL: ${{ secrets.MUSIC_API_BASE_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable debug signing key
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Require stable debug signing key
        if: env.DEBUG_KEYSTORE_BASE64 == ''
        run: |
          echo "Missing DEBUG_KEYSTORE_BASE64 repository secret."
          exit 1

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PMUSIC_API_BASE_URL="$MUSIC_API_BASE_URL" :app:assembleDebug

      - name: Verify Google Sign-In signing fingerprints
        run: |
          set -euo pipefail
          echo "=== Restored debug keystore SHA-1 ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
          echo "=== Android OAuth SHA-1 stored in google-services.json ==="
          jq -r '.client[].oauth_client[] | select(.client_type == 1) | .android_info.certificate_hash' app/google-services.json
          echo "=== APK signing certificate ==="
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          echo "APK: $APK"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" || echo "apksigner verification returned non-zero; diagnostic output shown above."
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibePlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
