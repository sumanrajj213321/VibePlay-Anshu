name: Build VibePlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable debug signing key
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Require stable debug signing key
        if: env.DEBUG_KEYSTORE_BASE64 == ''
        run: |
          echo "Missing DEBUG_KEYSTORE_BASE64 repository secret."
          exit 1

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Google Sign-In signing fingerprints
        run: |
          set -euo pipefail
          echo "=== Restored debug keystore SHA-1 ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
          echo "=== Android OAuth SHA-1 stored in google-services.json ==="
          jq -r '.client[].oauth_client[] | select(.client_type == 1) | .android_info.certificate_hash' app/google-services.json
          echo "=== APK signing certificate ==="
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'Signer #1 certificate SHA-1 digest|Signer #1 certificate SHA-256 digest'
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibePlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
