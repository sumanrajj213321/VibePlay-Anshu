name: Deploy VibePlay Music Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Worker without changing billing
        working-directory: cloudflare/music-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DBBYTE_API_KEY: ${{ secrets.DBBYTE_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DBBYTE_API_KEY" ]; then
            echo "Required GitHub Actions secrets are missing. No deployment was attempted."
            exit 1
          fi
          printf '%s' "$DBBYTE_API_KEY" | npx --yes wrangler@4 secret put DBBYTE_API_KEY
          npx --yes wrangler@4 deploy
