name: Firestore Security Rules Tests

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firestore.test.js"
      - "firebase.json"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore.test.js"
      - "firebase.json"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase test dependencies
        run: |
          npm init -y
          npm install --no-audit --no-fund firebase-tools @firebase/rules-unit-testing firebase

      - name: Run Firestore rules unit tests
        run: npx firebase emulators:exec --only firestore --project demo-no-project --config firebase.json "node --test firestore.test.js"
